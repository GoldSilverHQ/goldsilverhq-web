name: X Blog Mirror
# Twice daily Europe/Berlin ≈ 10:00 and 18:00.
# Cron is UTC: 0 8,16 * * * ≈ 10:00/18:00 CEST (UTC+2); ≈ 09:00/17:00 CET (UTC+1).
on:
  schedule:
    - cron: "0 8,16 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Discover new @GoldSilverHQ X Articles
        id: discover
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: |
          set +e
          node scripts/x-blog-mirror/discover.mjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Open draft issue when new Article(s) are pending
        if: steps.discover.outputs.exit_code == '78'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -f data/x-articles-pending.json ]; then
            echo "No pending file; skip."
            exit 0
          fi
          count=$(node -e "const p=require('./data/x-articles-pending.json'); const n=(p.articles||[p.article]).filter(Boolean).length; process.stdout.write(String(n))")
          title=$(node -e "
            const p=require('./data/x-articles-pending.json');
            const list=(p.articles&&p.articles.length)?p.articles:[p.article].filter(Boolean);
            if(list.length===1) process.stdout.write(list[0].title||'X Article');
            else process.stdout.write(list.length+' new X Articles');
          ")
          ids=$(node -e "
            const p=require('./data/x-articles-pending.json');
            const list=(p.articles&&p.articles.length)?p.articles:[p.article].filter(Boolean);
            process.stdout.write(list.map(a=>a.articleId).join(' '));
          ")
          body=$(node -e "
            const p=require('./data/x-articles-pending.json');
            const list=(p.articles&&p.articles.length)?p.articles:[p.article].filter(Boolean);
            const lines=[
              '## X→blog mirror candidates (' + list.length + ')',
              '',
              'Process **every** Article below in this window (no 1/run cap). One PR with multiple posts or sequential PRs are both OK — append each id to \`data/x-articles-seen.json\` as soon as it lands.',
              '',
            ];
            for (const a of list) {
              lines.push('### ' + (a.title || 'X Article'));
              lines.push('');
              lines.push('- **X Article:** ' + a.articleUrl);
              lines.push('- **Article id:** ' + a.articleId);
              lines.push('- **Post id:** ' + a.postId);
              lines.push('- **Published:** ' + a.createdAt);
              lines.push('');
            }
            lines.push('Pending payload: \`data/x-articles-pending.json\` (from the discover job — re-run discover locally or via Cursor).');
            lines.push('');
            lines.push('### Instructions');
            for (const i of (p.instructions||[])) lines.push(' - ' + i);
            lines.push('');
            lines.push('Do **not** invent figures. Skip if already on site. Process **all** eligible Articles in this pending file.');
            process.stdout.write(lines.join('\\n'));
          ")
          # Avoid duplicate open issues for the same set of article ids
          first_id=$(echo "$ids" | awk '{print $1}')
          existing=$(gh issue list --state open --search "x-blog-mirror $first_id" --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "Open issue already exists for $first_id (batch of $count)"
            exit 0
          fi
          gh issue create \
            --title "x-blog-mirror: $title" \
            --body "$body" \
            --label "x-blog-mirror" || \
          gh issue create \
            --title "x-blog-mirror: $title" \
            --body "$body"

      - name: Notice when X token missing
        if: steps.discover.outputs.exit_code == '0'
        run: |
          if [ -z "${{ secrets.X_BEARER_TOKEN }}" ]; then
            echo "::notice::Set repo secret X_BEARER_TOKEN (X API app Bearer) to enable scheduled discover. Fallback: Cursor Automation / timer twice daily Berlin — see docs/x-blog-republisher.md in the Project store."
          else
            echo "::notice::No new eligible Articles (or already mirrored)."
          fi
