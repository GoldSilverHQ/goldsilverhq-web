<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daily quiz — GoldSilverHQ</title>
  <meta name="description" content="Sound-money quiz: Nixon Shock, gold-silver ratio, Fed founding." />
  <link rel="canonical" href="https://goldsilverhq.com/quiz.html" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/site.css" />
</head>
<body>
  <header class="top"><div class="wrap bar">
    <a href="/" class="mark">G</a>
    <div><div class="brand">GoldSilverHQ</div></div>
    <nav>
      <a href="/">Tape</a><a href="quiz.html" class="on">Quiz</a><a href="world.html">Welt</a>
      <a href="ebooks.html">Ebooks</a><a href="blog.html">Geschichte</a>
    </nav>
  </div></header>
  <main class="wrap">
    <p class="kicker">Täglich</p>
    <h1>Sound-money Quiz</h1>
    <p class="lead">Sieben Fragen. Kein Konto. Ergebnis kannst du auf X teilen.</p>
    <div class="card" id="box" style="margin-top:1.25rem"></div>
  </main>
  <footer><p><a href="/">Tape</a> · Keine Anlageberatung.</p></footer>
  <script>
    const Q = [
      { q: "Was setzte Nixon im August 1971 wirklich aus?",
        c: ["Inländische Goldkonvertibilität für US-Bürger","Dollar-Konvertibilität in Gold für ausländische offizielle Halter zu 35 $/oz","Jeglichen privaten Goldbesitz","Die Federal Reserve selbst"],
        a: 1, w: "US-Bürger verloren die Konvertibilität 1933. 1971 schloss das Goldfenster für ausländische offizielle Halter." },
      { q: "Die klassische Gold-Silber-Ratio im bimetallischen Recht lag bei etwa:",
        c: ["8 zu 1","15 zu 1","40 zu 1","80 zu 1"], a: 1, w: "Münzgesetze und Lateinische Münzunion lagen bei 15–16. Die Minenratio liegt näher bei 8." },
      { q: "Wann wurde die Federal Reserve gegründet?",
        c: ["1907","1913","1933","1971"], a: 1, w: "Federal Reserve Act, Dezember 1913. Die Panik von 1907 war der Vorwand." },
      { q: "Executive Order 6102 (1933) betraf:",
        c: ["Silber-Demonetisierung","Privaten Goldbesitz in den USA","Bretton Woods","Die Gründung der BIS"],
        a: 1, w: "Roosevelt verbot privaten Goldbesitz im Inland. Die 35-Dollar-Parität folgte 1934." },
      { q: "John Laws Mississippi-System brach ungefähr in:",
        c: ["1637","1720","1797","1929"], a: 1, w: "Banque Royale und Compagnie des Indes — Papier bis 1720." },
      { q: "US-offizielle Goldreserven liegen bei rund:",
        c: ["800 Tonnen","2.000 Tonnen","8.100 Tonnen","36.000 Tonnen"], a: 2, w: "Fort Knox / US official: ~8.134 t. ~36.000 t ist die weltweite offizielle Summe." },
      { q: "Was ist ein Goldstandard in einem Satz?",
        c: ["Ein Kursziel der Zentralbank","Die Einheit ist ein Goldgewicht, Kredit ein Anspruch darauf","Ein ETF auf Goldminen","Ein Verbot von Silber"],
        a: 1, w: "Definition, keine Prognose. Wenn Konvertibilität Slogan ist, floatet die Einheit." }
    ];
    let i = 0, score = 0, locked = false;
    const box = document.getElementById("box");
    function render() {
      locked = false;
      if (i >= Q.length) {
        const tweet = `GoldSilverHQ Quiz: ${score}/${Q.length}. Sound money. goldsilverhq.com/quiz.html`;
        box.innerHTML = `<p class="kicker">Fertig</p><h2 class="quiz-q">${score} von ${Q.length}</h2>
          <p class="lead">Das Flagschiff erklärt den Rest.</p>
          <p><a class="btn" href="https://x.com/intent/tweet?text=${encodeURIComponent(tweet)}" target="_blank" rel="noreferrer">Ergebnis teilen</a>
          <a class="btn ghost" href="ebooks.html">Ebooks</a></p>`;
        return;
      }
      const x = Q[i];
      box.innerHTML = `<p class="kicker">Frage ${i+1} / ${Q.length}</p><h2 class="quiz-q">${x.q}</h2>
        ${x.c.map((t,n)=>`<button class="choice" data-n="${n}">${t}</button>`).join("")}
        <p class="why" id="why" hidden></p>`;
      box.querySelectorAll(".choice").forEach(btn => {
        btn.onclick = () => {
          if (locked) return;
          locked = true;
          const n = +btn.dataset.n;
          if (n === x.a) { score++; btn.classList.add("ok"); }
          else { btn.classList.add("bad"); box.querySelectorAll(".choice")[x.a].classList.add("ok"); }
          const why = document.getElementById("why");
          why.hidden = false; why.textContent = x.w;
          setTimeout(() => { i++; render(); }, 1400);
        };
      });
    }
    render();
  </script>
</body>
</html>
